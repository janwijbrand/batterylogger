# Installed as /etc/systemd/journald.conf.d/persistent.conf
#
# Keep the journal on disk, so the cause of a failure survives a reboot.
# The cap is sized for about four weeks: the journal grows roughly 4-8 MB a
# day, and an incident on a trip is only looked at once the van is home.
[Journal]
Storage=persistent
SystemMaxUse=250M
SystemMaxFileSize=10M
