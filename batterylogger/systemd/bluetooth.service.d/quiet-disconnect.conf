# Installed as /etc/systemd/system/bluetooth.service.d/quiet-disconnect.conf
#
# bluetoothd logs "No matching connection for device" at error level each
# time the logger drops its BLE link, i.e. on every poll. It is harmless, but
# at ~5,700 lines a day it was half the journal and buried real errors.
# Needs systemd >= 253.
[Service]
LogFilterPatterns=~No matching connection for device
